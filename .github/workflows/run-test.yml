name: Static analysis and code style

on:
    push:
        branches:
            - develop
            - 'release/**'
            - 'hotfix/**'
        tags: ['**']
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review

jobs:
    static-analysis-tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php-version: ['8.2', '8.3', '8.4', '8.5']
        steps:
            - uses: actions/checkout@v4
            # Image hashes in tests depend on GD/libjpeg builds: run in the same image as `make test`
            - name: Build php-dev image
              run: docker build --target php-dev --build-arg PHP_VERSION=${{ matrix.php-version }} -t intervention-test .
            - name: Cache Composer packages
              uses: actions/cache@v4
              with:
                  path: vendor
                  key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-php-${{ matrix.php-version }}-
            - name: Install Dependencies
              run: docker run --rm -v "$PWD:/app" intervention-test composer install --no-scripts --no-ansi --no-interaction --no-progress
            - name: Run unit tests
              run: docker run --rm -v "$PWD:/app" intervention-test php -d memory_limit=-1 vendor/bin/phpunit tests/
            - name: Run PHP CS Fixer
              run: docker run --rm -v "$PWD:/app" -e PHP_CS_FIXER_IGNORE_ENV=1 intervention-test vendor/bin/php-cs-fixer check --ansi -vvv
            - name: Run PHPStan
              run: docker run --rm -v "$PWD:/app" intervention-test php -d memory_limit=-1 vendor/bin/phpstan analyse --no-progress -c phpstan.neon
